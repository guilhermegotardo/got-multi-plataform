# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory containing .bb and .bbappend files, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb \
            ${LAYERDIR}/recipes*/*/*.bbappend"


BBFILE_COLLECTIONS += "meta-got"
BBFILE_PATTERN_meta-got = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-got = "6"

LAYERDEPENDS_meta-got = "core"
LAYERSERIES_COMPAT_meta-got = "wrynose scarthgap styhead walnascar"
